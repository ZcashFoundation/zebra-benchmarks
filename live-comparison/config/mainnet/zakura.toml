# Zakura v1.8.1 / f5c20398c629c8179364b07f059da3c814af78ec; isolated except for the dispatcher's P2P observer and authenticated RPC.
# Replace every /path/to path and miner address; bind only on a trusted LAN and firewall both ports to the dispatcher host.
[network]
network = "Mainnet"
p2p_stack = "legacy"
listen_addr = "0.0.0.0:29233"
initial_mainnet_peers = []
initial_testnet_peers = []
cache_dir = false
identity_dir = "/path/to/live-comparison/mainnet/zakura/identity"

[state]
cache_dir = "/path/to/live-comparison/mainnet/zakura/state"
ephemeral = false

[state.storage_mode.pruned]
tx_retention = 10000

[rpc]
listen_addr = "0.0.0.0:29232"
cookie_dir = "/path/to/live-comparison/mainnet/zakura/rpc"
cookie_file_name = ".cookie"
enable_cookie_auth = true

[mempool]
debug_enable_at_height = 0

[mining]
miner_address = "REPLACE_WITH_MAINNET_TRANSPARENT_ADDRESS"
