# Zebra v7.0.0 / e8db87eb69254e0d4eedd058eadd48bdfa09065a; isolated except for the dispatcher's P2P observer and authenticated RPC.
# Replace every /path/to path and miner address; bind only on a trusted LAN and firewall both ports to the dispatcher host.
[network]
network = "Mainnet"
listen_addr = "0.0.0.0:28233"
initial_mainnet_peers = []
initial_testnet_peers = []
cache_dir = false

[state]
cache_dir = "/path/to/live-comparison/mainnet/zebra-reference/state"
ephemeral = false

[rpc]
listen_addr = "0.0.0.0:28232"
cookie_dir = "/path/to/live-comparison/mainnet/zebra-reference/rpc"
enable_cookie_auth = true

[mempool]
debug_enable_at_height = 0

[mining]
miner_address = "REPLACE_WITH_MAINNET_TRANSPARENT_ADDRESS"
