# Zebra v7.0.0 / e8db87eb69254e0d4eedd058eadd48bdfa09065a; normal Testnet P2P.
# Replace every /path/to path before starting the node.
[network]
network = "Testnet"
listen_addr = "0.0.0.0:18333"
cache_dir = "/path/to/live-comparison/testnet/feeder/network-cache"

[state]
cache_dir = "/path/to/live-comparison/testnet/feeder/state"
ephemeral = false

[rpc]
listen_addr = "127.0.0.1:18332"
cookie_dir = "/path/to/live-comparison/testnet/feeder/rpc"
enable_cookie_auth = true
